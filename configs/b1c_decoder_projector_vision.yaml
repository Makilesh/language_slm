# B1(c) — decoder + projector + LoRA on the vision encoder itself.
#
# The arm standing rule 2 warns against: unfreezing the vision tower is expected
# to destabilise visual features without a large, high-quality multimodal
# dataset. Included because the brief says to TEST that claim rather than
# inherit it — and because the general-capability probe (DocVQA, base ANLS
# 0.9237) is what will show the cost if it is real.
#
# Every other field is identical to configs/b1a_decoder.yaml — one variable per
# experiment (standing rule 5).

model: Qwen/Qwen3-VL-4B-Instruct
dataset: data/train/train.jsonl
output_dir: outputs/b1c_decoder_projector_vision
run_name: b1c_decoder_projector_vision

train_mode: decoder_projector_vision

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05

lr: 1.0e-4
epochs: 2.0
batch_size: 1
grad_accum: 16
warmup_ratio: 0.03
scheduler: cosine
max_grad_norm: 1.0

# configs/RESOLUTION_POLICY.md: 448px is the only resolution whose backward
# pass fits in 11.94 GiB. max_seq_len 2048 clears the measured max of 1,928.
long_edge: 448
max_seq_len: 2048
prompt_style: engineered

# Frozen ViT kept in bf16: ~0.44B params, so bf16 costs well under a gigabyte
# over NF4, and there is no reason to push quantization error through features
# that are never trained.
quantize_vision: false
attn: sdpa

seed: 42
logging_steps: 10
save_steps: 500
save_total_limit: 2
